
services:
  web:
    build: .
    container_name: waste-segregation-web
    ports:
      - "8501:8501"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: waste-segregation-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: waste_db
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
